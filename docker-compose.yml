services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shelf
      POSTGRES_USER: shelf
      POSTGRES_PASSWORD: shelf
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    # Published by .github/workflows/docker-publish.yml on every push to
    # master — Watchtower below pulls a new :latest automatically. Swap this
    # for `build: .` instead if you'd rather build from your own checkout
    # (e.g. local changes) and skip auto-updates.
    image: ghcr.io/jessekward-prog/shelf-cmd:latest
    container_name: shelf-cmd-app
    labels:
      - com.centurylinklabs.watchtower.enable=true
    ports:
      - "3016:3016"
    environment:
      PORT: 3016
      DATABASE_URL: postgresql://shelf:shelf@db:5432/shelf
      TWITCH_PARENT: ${TWITCH_PARENT:-localhost}
      LM_STUDIO_URL: ${LM_STUDIO_URL:-}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-}
      LM_STUDIO_API_KEY: ${LM_STUDIO_API_KEY:-}
      # Raises the guide-generation GitHub API calls from 60/hr (shared across the
      # whole box) to 5000/hr. A plain personal access token with public read scope.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Shared shelves federate through a hub. Unset = the public default hub
      # (baked into the app). Point at your own shelf-hub for full independence.
      HUB_URL: ${HUB_URL:-}
      HUB_SYNC: ${HUB_SYNC:-}
      HUB_SYNC_MS: ${HUB_SYNC_MS:-}
      # Drive uploads live on a persistent volume so files survive rebuilds.
      UPLOADS_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-512}
    volumes:
      - uploads:/app/uploads
    depends_on:
      - db

  # Auto-update: polls for a new `app` image every hour and recreates the
  # container when one lands — only touches containers labeled
  # watchtower.enable=true above, so `db` is never restarted by this.
  # Remove this service if you switched `app` to `build: .`.
  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --cleanup --interval 3600

volumes:
  pgdata:
  uploads:
