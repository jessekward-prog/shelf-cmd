services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3016:3016"
    environment:
      PORT: 3016
      DATABASE_URL: postgresql://shelf:shelf@db:5432/shelf
      LM_STUDIO_URL: http://host.docker.internal:1234
      LM_STUDIO_MODEL: ""
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shelf
      POSTGRES_PASSWORD: shelf
      POSTGRES_DB: shelf
    volumes:
      - shelf_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelf"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shelf_db:
